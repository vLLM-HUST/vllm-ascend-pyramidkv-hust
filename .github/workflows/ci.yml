name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    env:
      VLLM_HUST_BENCHMARK_ORIGINALS: /tmp/benchmark-originals
      OMP_NUM_THREADS: '2'
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools without KVCompress
        run: |
          python -m pip install \
            "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@d22088cf6a45aeb7c47e39101607a00d87bf2006"
          python -m pip install -e ".[test]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/fetch_benchmark_originals.py "$VLLM_HUST_BENCHMARK_ORIGINALS"
      - run: pytest -q
      - run: python -m build
      - name: Verify clean wheel and standalone Manager lifecycle
        if: matrix.python == '3.12'
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install \
            "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@d22088cf6a45aeb7c47e39101607a00d87bf2006"
          .wheel-smoke/bin/python -m pip install dist/vllm_ascend_pyramidkv_hust-*.whl
          .wheel-smoke/bin/python scripts/check_standalone_install.py
          export XDG_CONFIG_HOME="$PWD/.ecpa-state/config"
          export XDG_STATE_HOME="$PWD/.ecpa-state/state"
          export XDG_CACHE_HOME="$PWD/.ecpa-state/cache"
          cli=.wheel-smoke/bin/vllm-hust-ext
          "$cli" extension enable org.vllm-hust.ascend-pyramidkv
          "$cli" extension inspect org.vllm-hust.ascend-pyramidkv \
            | grep '"activation_ready": true'
          "$cli" extension plan org.vllm-hust.ascend-pyramidkv \
            | grep 'vllm-ascend.kv-cache.mutation'
          "$cli" extension render org.vllm-hust.ascend-pyramidkv \
            | grep 'ascend_pyramidkv'
          if "$cli" run --dry-run -- python -c pass; then
            echo 'unverified host was unexpectedly accepted' >&2
            exit 1
          fi
          "$cli" extension disable org.vllm-hust.ascend-pyramidkv
          "$cli" extension forget org.vllm-hust.ascend-pyramidkv
